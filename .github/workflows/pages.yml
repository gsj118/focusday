name: Publish Focusday to Pages
# Deployment is explicit until the assignment repository is confirmed.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        id: pages
      - run: pnpm check
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          PW_CHANNEL: chromium
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          E2E_BASE_URL: http://127.0.0.1:4173${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
